  </main>

  <script>
    (function () {
      var targey = document.querySelector(".type");
      var spaceeee = document.querySelector(".sp");
      var name = "iroha";

      function fancydancymagictype() {
        return 300 + (Math.random() * 2 - 1) * 100;
      }

      // reduced motion i think
      var reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

      if (!targey) return;

      function showSpace() {
        if (spaceeee) spaceeee.style.display = "";
      }

      if (reduce) {
        targey.textContent = name;
        showSpace();
        return;
      }

      if (spaceeee) spaceeee.style.display = "none";

      var i = 0;
      (function type() {
        if (i < name.length) {
          i += 1;
          targey.textContent = name.slice(0, i);
          setTimeout(type, fancydancymagictype());
        } else {
          setTimeout(showSpace, fancydancymagictype());
        }
      })();
    })();
  </script>

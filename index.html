  <script>
    (function () {
      var targey = document.querySelector(".type");
      var spaceeee = document.querySelector(".sp");
      var name = "iroha";

      function fancydancymagictype() {
        return 300 + (Math.random() * 2 - 1) * 100;
      }

      // reduced motion i think
      var reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

      if (!targey) return;

      function showSpace() {
        if (spaceeee) spaceeee.style.display = "";
      }

      if (reduce) {
        targey.textContent = name;
        showSpace();
        return;
      }

      if (spaceeee) spaceeee.style.display = "none";

      var i = 0;
      (function type() {
        if (i < name.length) {
          i += 1;
          targey.textContent = name.slice(0, i);
          setTimeout(type, fancydancymagictype());
        } else {
          setTimeout(showSpace, fancydancymagictype());
        }
      })();
    })();
  </script>

  <script>
    // now playing — polls naviapi every 15s, shows the last played track
    // when nothing is playing, and puts the earlier tracks in a dropdown.
    (function () {
      var API = "https://stats.yuri.green/v1/now-playing";
      var POLL_MS = 15000;

      var root = document.getElementById("now");
      if (!root) return;

      var label = document.getElementById("now-label");
      var player = document.getElementById("now-player");
      var art = document.getElementById("now-art");
      var title = document.getElementById("now-title");
      var artist = document.getElementById("now-artist");
      var fill = document.getElementById("now-fill");
      var hist = document.getElementById("now-hist");
      var list = document.getElementById("now-list");

      var etag = null;
      var state = null;

      // the track shown in the player: the current one, or the newest scrobble
      function current() {
        if (!state) return null;
        if (state.playing && state.track) return { track: state.track, idle: false };
        if (state.recent && state.recent.length) return { track: state.recent[0], idle: true };
        return null;
      }

      function render() {
        var main = current();
        if (!main) {
          root.hidden = true;
          return;
        }
        root.hidden = false;

        var t = main.track;
        player.classList.toggle("now__player--idle", main.idle);
        label.textContent = main.idle ? "// last played" : "// now playing";

        if (art.getAttribute("src") !== t.artwork) art.src = t.artwork;
        art.alt = t.album ? t.album + " cover" : "";

        title.textContent = t.title;
        if (t.url) {
          title.href = t.url;
          title.target = "_blank";
          title.rel = "noopener";
        } else {
          title.removeAttribute("href");
        }
        artist.textContent = t.artist;

        renderHistory(main);
        tick();
      }

      function renderHistory(main) {
        var items = state.recent ? state.recent.slice() : [];

        // the entry already shown in the player doesn't belong in the list
        var skip = main.track;
        items = items.filter(function (item) {
          return !(item.title === skip.title && item.artist === skip.artist);
        });

        hist.hidden = items.length === 0;

        list.replaceChildren.apply(
          list,
          items.map(function (item) {
            var li = document.createElement("li");

            var img = document.createElement("img");
            img.src = item.artwork;
            img.alt = "";
            img.width = 28;
            img.height = 28;
            img.loading = "lazy";

            var box = document.createElement("div");
            box.className = "now__li";

            var a = document.createElement("a");
            a.className = "now__li-title";
            a.textContent = item.title;
            if (item.url) {
              a.href = item.url;
              a.target = "_blank";
              a.rel = "noopener";
            }

            var s = document.createElement("span");
            s.className = "now__li-artist";
            s.textContent = item.artist;

            box.append(a, s);
            li.append(img, box);
            return li;
          })
        );
      }

      // progress is a snapshot, so tick it locally from startedAt
      function tick() {
        var main = current();
        var t = main && !main.idle ? main.track : null;
        if (!t || !t.startedAt || !t.duration) {
          fill.style.width = "0%";
          return;
        }
        var elapsed = (Date.now() - Date.parse(t.startedAt)) / 1000;
        var pct = Math.min(100, Math.max(0, (elapsed / t.duration) * 100));
        fill.style.width = pct + "%";
      }

      async function poll() {
        if (document.hidden) return;
        try {
          var res = await fetch(API, {
            headers: etag ? { "If-None-Match": etag } : {},
          });
          if (res.status === 304) return;
          if (!res.ok) return;
          etag = res.headers.get("ETag");
          state = await res.json();
          render();
        } catch (e) {
          // keep whatever is on screen; the next poll will try again
        }
      }

      setInterval(tick, 1000);
      setInterval(poll, POLL_MS);
      document.addEventListener("visibilitychange", poll);
      poll();
    })();
  </script>
